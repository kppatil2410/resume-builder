# Production configuration for cloud deployment
# Copy this to application.properties for production

# Server
server.port=${PORT:8080}

# Database (use environment variables for cloud databases)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/resume_builder?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Kiran@1718}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:ResumeAI_SuperSecret_JWT_Key_2024_MustBe256BitsLongForHS256AlgorithmSecurity}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OpenAI
openai.api.key=${OPENAI_API_KEY:your_openai_api_key_here}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-3.5-turbo

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.resumebuilder=INFO

# Production optimizations
spring.jpa.open-in-view=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json