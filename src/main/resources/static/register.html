<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — ResumeAI</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="brand-link">
                    <span class="brand-icon">📄</span>
                    <span class="brand-name">ResumeAI</span>
                </a>
                <h2>Create your account</h2>
                <p>Start building better resumes today</p>
            </div>

            <div id="alert" class="alert hidden"></div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min. 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                    Create Account
                </button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="/login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            btn.textContent = 'Creating account...';
            btn.disabled = true;

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await api('/api/auth/register', 'POST', data);
                if (res.success) {
                    localStorage.setItem('token', res.data.token);
                    localStorage.setItem('userName', res.data.name);
                    localStorage.setItem('userEmail', res.data.email);
                    window.location.href = '/dashboard.html';
                } else {
                    showAlert(res.message || 'Registration failed', 'error');
                }
            } catch (err) {
                showAlert('Something went wrong. Please try again.', 'error');
            } finally {
                btn.textContent = 'Create Account';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
